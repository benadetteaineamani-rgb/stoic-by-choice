<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0906">
  <title>Stoic by Choice · Biggest Loser Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stoic by Choice">
  <meta name="application-name" content="Stoic by Choice">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brandwrap"><img class="brandlogo" src="/icons/icon-192.png" alt="Stoic by Choice logo" width="44" height="44"><div>
        <div class="brand">Stoic by Choice</div><div class="brand-sub">Biggest Loser Challenge</div>
        <div class="dateline" id="dateline"></div>
      </div></div>
      <div class="topbtns"><button id="inboxBtn" class="inboxbtn" aria-label="Inbox" hidden>📥<span id="inboxBadge" class="badge" hidden></span></button><button id="whoBtn" class="who" aria-label="Switch person"></button></div>
    </div>
    <div class="syncrow"><div class="sync" id="sync">Connecting…</div><button id="installBtn" class="installbtn" hidden>📲 Add to home screen</button></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active"><span>🏠</span>Home</button>
    <button data-tab="challenge"><span>🎯</span>Challenge</button>
    <button data-tab="review"><span>🎉</span>Review</button>
    <button data-tab="log"><span>✍🏾</span>Log</button>
    <button data-tab="board"><span>📊</span>Board</button>
    <button data-tab="awards"><span>🏆</span>Awards</button>
    <button data-tab="me"><span>📈</span>Progress</button>
    <button data-tab="admin" id="tabAdmin" hidden><span>🛡️</span>Admin</button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="confetti" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
